name: test

# The whole point of the binding seam is that CI needs neither the Camera Remote
# SDK nor a camera: the suite runs the real module against the simulated body in
# src/binding/fake.py. Publishing is a separate, manual step until open question
# 2 (where CI gets the SDK from) is settled - see README.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      - name: Compile-check every source file
        run: python -m compileall -q src tests native/setup.py
      - name: Run the test suite
        run: python -m pytest -q
